<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Haiku Chapter6 Practice</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Delius+Swash+Caps&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 1rem;
        background-color: black;
        color: whitesmoke;
        font-size: 5rem;
        font-family: "Delius Swash Caps";
        background: url("assets/img/rain.gif") no-repeat center/cover;
      }

      .delius-swash-caps-regular {
        font-family: "Delius Swash Caps", cursive;
        font-weight: 400;
        font-style: normal;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 2rem;
        margin: 15% 4rem 0 4rem;
      }

      .last {
        padding-bottom: 2rem;
        border-bottom: 2px solid rgb(58, 189, 154);
      }

      html {
        width: 100%;
        height: 100%;
      }

      body {
        transition-property: transform;
        transition-duration: 3s;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div>Rain</div>
      <div>on</div>
      <div>my</div>
      <div class="last">window</div>
      <div>I</div>
      <div>know</div>
      <div>the</div>
      <div>sun</div>
      <div>will</div>
      <div>come</div>
      <div class="last">out</div>
      <div>and</div>
      <div>bring</div>
      <div>light</div>
      <div class="last">again.</div>
    </div>

    <script>
      function randomNumber(min, max) {
        return Math.random() * (max - min) + min;
      }
      // define divs variable
      let divs = document.querySelectorAll(".grid-container div");
      function randomize() {
        //apply only to each of the div tags
        divs.forEach(function (div) {
          let scale = randomNumber(0.5, 1.2);
          let translateX = randomNumber(0, 50);
          let translateY = randomNumber(0, 20);
          let rotate = randomNumber(0, 360);
          //half of the time do this
          if (Math.random() > 0.5) {
            scale = 1; //dont affect scale
            translateX = randomNumber(0, 80);
            translateY = randomNumber(0, 80);
          }
          div.style.transform = `scale(${scale}) translate(${translateX}%, ${translateY}%) rotate(${rotate}deg)`;
        });
      }
      document.addEventListener("click", randomize);

      /* let rotation = 0;
document.addEventListener("click", function () {
  let min = 10;
  let max = 40;
  rotation += Math.random() * (max - min) + min;
  document.body.style.transform = `rotate(${rotation}deg)`;
});
*/
    </script>
  </body>
</html>
